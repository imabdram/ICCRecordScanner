<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SCMS login - preview</title>
<style>
  :root {
    --red: #e30613;
    --navy: #102a54;
    --ink: #111827;
    --muted: #6e7786;
    --line: #e2e8f0;
    --bg: #f6f7fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .login-page {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 24px;
    overflow: hidden;
    background:
      radial-gradient(680px 520px at -6% 108%, rgba(227, 6, 19, 0.10), transparent 62%),
      radial-gradient(620px 480px at 104% -8%, rgba(16, 42, 84, 0.08), transparent 60%),
      var(--bg);
  }
  .login-page::before,
  .login-page::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .login-page::before {
    width: 720px; height: 720px;
    left: -300px; bottom: -420px;
    border: 3px solid rgba(227, 6, 19, 0.16);
  }
  .login-page::after {
    width: 620px; height: 620px;
    right: -260px; top: -380px;
    border: 3px solid rgba(16, 42, 84, 0.13);
  }

  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 430px;
    padding: 34px 34px 30px;
    background: #fff;
    border: 1px solid #edf0f5;
    border-radius: 22px;
    box-shadow: 0 24px 60px -28px rgba(16, 24, 40, 0.35), 0 2px 6px rgba(16, 24, 40, 0.04);
  }

  .login-brand { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
  .login-logo { width: 132px; height: auto; display: block; }
  .tagline { font-size: 12.5px; color: var(--muted); }

  .login-title { font-size: 25px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .login-sub { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }

  .field { display: block; margin-bottom: 16px; }
  .field > span {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .field input {
    display: block;
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #fafbfd;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
  }
  .field input::placeholder { color: #96a0b0; }
  .field input:focus {
    outline: none;
    border-color: var(--red);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.12);
  }

  .with-reveal { position: relative; }
  .with-reveal input { padding-right: 46px; }
  .reveal {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 0; background: none; cursor: pointer;
    border-radius: 8px;
    color: var(--muted);
  }
  .reveal:hover { background: #f1f4f8; }
  .reveal.on { color: var(--red); }
  .eye {
    width: 18px; height: 12px;
    border: 2px solid currentColor;
    border-radius: 50% / 60%;
    display: grid; place-items: center;
  }
  .pupil { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .signin {
    width: 100%;
    height: 48px;
    margin-top: 22px;
    border: 0;
    border-radius: 12px;
    background: var(--red);
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .signin:hover { background: #c90511; }

  .notice {
    margin-top: 22px;
    padding: 12px 14px;
    border-radius: 11px;
    background: #faf6f6;
    border: 1px solid #f6e4e6;
  }
  .notice-title {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #96424a;
    margin-bottom: 4px;
  }
  .notice p { margin: 0; font-size: 11.5px; line-height: 1.5; color: #6c5458; }

  .result {
    margin-top: 14px;
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 10px;
    display: none;
  }
  .result.ok { display: block; background: #eaf6ee; color: #1f7a3d; border: 1px solid #d6ecdc; }
  .result.bad { display: block; background: #fdecee; color: #b3261e; border: 1px solid #f8d7db; }

  .login-footer {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #a6adba;
  }

  @media (max-width: 720px) {
    .login-page { padding: 22px 16px; }
    .login-card { padding: 26px 22px 24px; border-radius: 18px; }
    .login-title { font-size: 22px; }
    .login-footer { position: static; transform: none; margin-top: 18px; text-align: center; }
  }
</style>
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="form" novalidate>
      <div class="login-brand">
        <img class="login-logo" src="/amtel-logo.png" alt="Amtel" />
        <span class="tagline">Always closer you</span>
      </div>

      <h1 class="login-title">SIM Management System</h1>
      <p class="login-sub">Sign in to the Bari Region operations console.</p>

      <label class="field">
        <span>Username</span>
        <input id="username" name="username" type="text" required autocomplete="username"
               autocapitalize="none" spellcheck="false" placeholder="your.username" />
      </label>

      <label class="field">
        <span>Password</span>
        <div class="with-reveal">
          <input id="password" name="password" type="password" required
                 autocomplete="current-password" placeholder="Enter your password" />
          <button class="reveal" id="reveal" type="button" aria-label="Show password" aria-pressed="false">
            <span class="eye"><span class="pupil"></span></span>
          </button>
        </div>
      </label>

      <button class="signin" type="submit">Sign in</button>
      <div class="result" id="result"></div>

      <div class="notice">
        <span class="notice-title">Security notice</span>
        <p>Accounts are created by an administrator. If you have forgotten your password,
           ask them to set a new one — there is no reset email.</p>
      </div>
    </form>
    <div class="login-footer">Amtel · Bari Region</div>
  </main>

<script>
  // Preview only: no authentication, no network. It just proves the fields are
  // real inputs and that the reveal toggle works.
  const password = document.getElementById('password');
  const reveal = document.getElementById('reveal');
  reveal.addEventListener('click', () => {
    const showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    reveal.classList.toggle('on', !showing);
    reveal.setAttribute('aria-pressed', String(!showing));
    reveal.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    password.focus();
  });

  const result = document.getElementById('result');
  document.getElementById('form').addEventListener('submit', (event) => {
    event.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = password.value;
    result.className = 'result bad';
    if (!user || !pass) {
      result.textContent = 'Enter your username and password.';
      return;
    }
    result.className = 'result ok';
    result.textContent = `Preview only — would sign in as “${user}”. Nothing was sent.`;
  });
</script>
</body>
</html>
