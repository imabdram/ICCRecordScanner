name: icc_record_scanner
description: Offline-first SIM card recorder with optional Supabase sync.
publish_to: "none"
version: 2.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  excel: ^4.0.6
  intl: ^0.20.2
  # Session, auth and data. Replaces the Neon client entirely.
  supabase_flutter: ^2.5.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sim-manager-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E71924"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
