name: icc_record_scanner
description: Offline ICC ID customer record scanner with WhatsApp sharing and Excel export.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  excel: ^4.0.6
  intl: ^0.20.2
  # Neon Postgres backend (replaces Firebase):
  #   http -> Neon Data API, flutter_secure_storage -> JWT session token.
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^7.3.2
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sim-manager-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E71924"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
